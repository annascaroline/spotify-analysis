name: CI

on:
  push:
  pull_request:

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check notebook for shell `export` lines (warning)
        run: |
          python - <<'PY'
          import json
          nb = json.load(open('spotify-analysis.ipynb'))
          found = False
          for i, c in enumerate(nb.get('cells', []), 1):
              for line in c.get('source', []):
                  if isinstance(line, str) and line.strip().startswith('export '):
                      print(f'Warning: found shell export in cell {i}: {line.strip()}')
                      found = True
          if not found:
              print('No shell export lines found.')
          PY

      - name: Execute notebook (nbconvert)
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
        run: |
          python -m nbconvert --to notebook --execute spotify-analysis.ipynb --output spotify-analysis.executed.ipynb --ExecutePreprocessor.timeout=600
